[project]
name = "multimodalhugs"
description = "MultimodalHugs is an extension of Hugging Face that offers a generalized framework for training, evaluating, and using multimodal AI models with minimal code differences, ensuring seamless compatibility with Hugging Face pipelines."
version = "0.5.4"
authors = [
    { name = "Gerard Sant", email = "gerard.santmuniesa@uzh.ch" },
    { name = "Zifan Jiang" },
    { name = "Carlos Escolano" },
    { name = "Amit Moryossef" },
    { name = "Mathias Müller" },
    { name = "Rico Sennrich" },
    { name = "Sarah Ebling" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "torch>=2.6,<2.11",  # torchvision 0.26 (torch 2.11) removed read_video — see issue #83
    "torchaudio>=2.6,<2.11",
    "transformers>=5.5.0,<6.0",
    "accelerate",
    "librosa",
    "numpy",
    "scipy",
    "pandas",
    "omegaconf",
    "sentencepiece",
    "sacremoses",
    "sacrebleu",
    "wandb",
    "nltk",
    "jiwer",
    "Pillow",
    "evaluate",
    "ruamel.yaml",
    "tf-keras",
]

[project.optional-dependencies]
pose = [
    "pose-format>=0.10.1",
]
video = [
    "av>=10.0.0",
    "torchvision>=0.21,<0.26",
    "opencv-python",
]
signwriting = [
    "signwriting @ git+https://github.com/sign-language-processing/signwriting",
]
image = [
    "opencv-python",
]
full = [
    "multimodalhugs[pose]",
    "multimodalhugs[video]",
    "multimodalhugs[signwriting]",
    "multimodalhugs[image]",
]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "mediapipe<0.10.30"
]
keras = [
    "keras-nlp",
    "keras>=3"
]
huggingface = [
    "peft"
]
visualization = [
    "matplotlib",
    "seaborn",
    "plotly"
]

# Formatting and linting follow transformers' own ruff configuration (119 columns,
# py311 target). Run `ruff format` and `ruff check` on the files you change; see AGENTS.md §5.
[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # Pyflakes
    "I",       # isort
    "W",       # pycodestyle warnings
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "S110",    # try-except-pass
    "RUF013",  # implicit Optional in annotations
]
ignore = [
    "E501",  # line length is the formatter's job
    "E741",  # ambiguous variable names (l, O, I)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["multimodalhugs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]  # This specifies the directory to look for tests
pythonpath = ["tests"]  # makes `import assets.generate_assets` work without sys.path hacks

[project.scripts]
multimodalhugs-train = "multimodalhugs.multimodalhugs_cli.train:main"
multimodalhugs-setup = "multimodalhugs.multimodalhugs_cli.training_setup:main"
multimodalhugs-generate = "multimodalhugs.multimodalhugs_cli.generate:main"

# short aliases
mmhugs-train = "multimodalhugs.multimodalhugs_cli.train:main"
mmhugs-setup = "multimodalhugs.multimodalhugs_cli.training_setup:main"
mmhugs-generate = "multimodalhugs.multimodalhugs_cli.generate:main"
